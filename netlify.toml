# Configuración de Netlify (tiene prioridad sobre lo que esté escrito en el panel)
[build]
  publish = "frontend"            # pantallas (HTML, CSS y JS del navegador)
  functions = "netlify/functions" # API REST

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

# Todas las peticiones a /api/... las atiende la función "api"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
