<main class="pagina">
  <div class="encabezado">
    <div><h1>Agendar clase</h1><p>Cuéntanos qué necesitas y qué día; te mostramos los tutores que pueden darte la clase.</p></div>
  </div>
  <form class="tarjeta buscador" id="filtros" aria-label="Buscar tutor">
    <fieldset class="paso-b" id="paso-1">
      <legend><span class="num-paso">1</span>¿Qué necesitas aprender?</legend>
      <div class="campos-b">
        <div class="campo"><label for="f-materia">Materia</label>
          <select class="entrada" id="f-materia" required><option value="">Elige una materia</option></select></div>
        <div class="campo"><label for="f-nivel">Nivel</label>
          <select class="entrada" id="f-nivel"><option value="">Cualquier nivel</option></select></div>
        <div class="campo"><label for="f-duracion">Duración</label>
          <select class="entrada" id="f-duracion">
            <option value="60" selected>1 hora</option>
            <option value="90">1 hora y media</option>
            <option value="120">2 horas</option>
            <option value="180">3 horas</option>
            <option value="240">4 horas</option>
          </select></div>
      </div>
    </fieldset>
    <fieldset class="paso-b" id="paso-2" disabled>
      <legend><span class="num-paso">2</span>¿Qué día?</legend>
      <div class="chips" id="dias"></div>
      <input class="entrada fecha-otra" type="date" id="f-fecha" aria-label="Otra fecha" hidden>
    </fieldset>
    <fieldset class="paso-b" id="paso-3" disabled>
      <legend><span class="num-paso">3</span>¿Cómo prefieres la clase? <small>opcional</small></legend>
      <div class="campos-b">
        <div class="chips" role="radiogroup" aria-label="Modalidad">
          <label class="chip"><input type="radio" name="modalidad" value="" checked><span>Me da igual</span></label>
          <label class="chip"><input type="radio" name="modalidad" value="virtual"><span>Virtual</span></label>
          <label class="chip"><input type="radio" name="modalidad" value="presencial"><span>Presencial</span></label>
        </div>
        <div class="campo" id="campo-ciudad" hidden><label for="f-ciudad">Ciudad</label>
          <select class="entrada" id="f-ciudad"><option value="">Cualquier ciudad</option></select></div>
      </div>
    </fieldset>
  </form>
  <section class="seccion resultados-b" id="resultados" hidden>
    <div class="seccion-titulo"><h2 id="titulo-resultados"></h2></div>
    <div class="rejilla rejilla-3" id="lista-tutores"></div>
  </section>
</main>
