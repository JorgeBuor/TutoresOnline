<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta · TutoresOn-Line</title>
  <meta name="description" content="TutoresOn-Line: plataforma para conectar estudiantes con tutores, en clases virtuales o presenciales.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-rol="estudiante" data-rol-fijo class="sin-barra">


<main class="auth">
  <div class="caja">
    <input class="oculto" type="radio" name="rol" id="rol-estudiante" checked>
    <input class="oculto" type="radio" name="rol" id="rol-docente">
    <div class="marca-grande">
      <h1>Crear cuenta</h1>
      <p>Únete hoy y empieza a enseñar o aprender</p>
    </div>
    <div class="tarjeta">
      <div class="selector-rol" role="radiogroup" aria-label="Tipo de cuenta">
        <label for="rol-estudiante">Estudiante</label>
        <label for="rol-docente">Docente</label>
      </div>
      <a class="btn btn-google bloque solo-reg-estudiante" href="estudiante/inicio.html"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.49 12c0-.73.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg> Registrarse con Google</a>
      <a class="btn btn-google bloque solo-reg-docente" href="docente/inicio.html"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.49 12c0-.73.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg> Registrarse con Google</a>
      <div class="divisor">o</div>
      <div class="campo"><label for="nombre">Nombre completo</label><input class="entrada" id="nombre" placeholder="Ej: María Camila Restrepo" autocomplete="name"></div>
      <div class="campo"><label for="correo-r">Correo electrónico</label><input class="entrada" id="correo-r" type="email" placeholder="ejemplo@tutores.com" autocomplete="email"></div>
      <div class="campo"><label for="clave-r">Contraseña</label><input class="entrada" id="clave-r" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password"></div>
      <div class="campo solo-reg-docente materia-docente">
        <label for="materias-r">Materias que enseñas</label>
        <input class="entrada" id="materias-r" placeholder="Física Cuántica, Álgebra Lineal">
        <span class="ayuda">Separa las materias con comas. Tarifas y horarios los defines después en Disponibilidad.</span>
      </div>
      <a class="btn turquesa bloque grande solo-reg-estudiante" href="estudiante/inicio.html">Crear cuenta</a>
      <a class="btn ambar bloque grande solo-reg-docente" href="docente/inicio.html">Crear cuenta</a>
    </div>
    <p class="pie-auth">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
  </div>
</main>

<script src="js/rol.js"></script>
</body>
</html>
